spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/redbank}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  docker:
    compose:
      enabled: true
  liquibase:
    contexts: dev
    parameters:
      admin.password-hash: ${ADMIN_PASSWORD_HASH}
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.security: DEBUG

    # SQL
    org.hibernate.SQL: DEBUG
    org.springframework.orm.jpa: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3001,http://localhost:8080,https://e50a-182-176-170-179.ngrok-free.app,https://redbank-frontend.vercel.app}
  security:
    refresh-cookie:
      name: refresh-token
      same-site: Lax
      secure: false

server:
  forward-headers-strategy: framework
