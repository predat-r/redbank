spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
  docker:
    compose:
      enabled: false
  liquibase:
    contexts: prod
    parameters:
      admin.password-hash: ${ADMIN_PASSWORD_HASH}
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.hazelcast.internal.server.tcp: OFF

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS},https://redbank-frontend.vercel.app
  security:
    refresh-cookie:
      name: __Secure-refresh-token
      path: /api/auth
      same-site: None
      secure: true

server:
  forward-headers-strategy: framework

management:
  otlp:
    metrics:
      export:
        enabled: true
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: true
  logging:
    export:
      otlp:
        enabled: true