spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  docker:
    compose:
      enabled: false
  liquibase:
    contexts: prod
    parameters:
      admin.password-hash: ${ADMIN_PASSWORD_HASH}
  security:
    jwt:
      access-token-ttl: 15m
      refresh-token-ttl: 7d
      private-key: ${JWT_PRIVATE_KEY}
      public-key: ${JWT_PUBLIC_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    org.springframework.web: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
    com.hazelcast.internal.server.tcp: OFF

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS},https://redbank-frontend.vercel.app
  security:
    refresh-cookie:
      name: __Secure-refresh-token
      path: /api/auth
      same-site: None
      secure: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  tomcat:
    threads:
      max: 30
      min-spare: 5

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
  tracing:
    sampling:
      probability: 0.1
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}
  logging:
    export:
      otlp:
        enabled: ${OTLP_LOGGING_ENABLED:false}
