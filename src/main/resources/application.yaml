spring:
  application:
    name: redbank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          model: gemini-3.5-flash-lite
          response-mime-type: application/json
        embedding:
          api-key: ${GEMINI_API_KEY}
          model: gemini-embedding-002

    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        initialize-schema: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    refresh-cookie:
      name: __Secure-refresh-token
      path: /api/auth
      same-site: None
      secure: true

scheduler:
  reconciliation:
    cron: "0 0 0 * * *"
  registration-cleanup:
    cron: "0 0 3 * * *"
  stale-transaction:
    cron: "0 0 * * * *"

management:
  endpoint:
    health:
      show-details: never
  tracing:
    sampling:
      probability: 1.0

ip-geolocation:
  base-url: https://api.ipgeolocation.io
  api-key: ${IP_GEOLOCATION_API_KEY:}

reputation-lookup:
  base-url: https://api.abuseipdb.com/api/v2
  api-key: ${ABUSE_IPDB_API_KEY:}
