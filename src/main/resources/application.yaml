spring:
  application:
    name: redbank
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
        embedding:
          api-key: ${GEMINI_API_KEY}
          options:
            model: gemini-embedding-001
    vectorstore:
      pgvector:
        dimensions: 768
        distance-type: COSINE_DISTANCE
        initialize-schema: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  security:
    refresh-cookie:
      name: __Secure-refresh-token
      path: /api/auth
      same-site: None
      secure: true

scheduler:
  reconciliation:
    cron: "0 0 0 * * *"
  registration-cleanup:
    cron: "0 0 3 * * *"
  stale-transaction:
    cron: "0 */15 * * * *"



management:
  tracing:
    sampling:
      probability: 1.0
