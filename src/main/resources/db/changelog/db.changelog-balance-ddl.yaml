databaseChangeLog:
  - changeSet:
      id: create-balances-table
      author: ahmad.tariq
      changes:
        - createTable:
            tableName: balance
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: account_holder_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_balance_account_holder
                    references: account_holders(id)
              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: fk_balance_transaction
                    references: bank_transactions(id)
              - column:
                  name: entry_date
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: amount
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: indicator
                  type: VARCHAR(10)
                  constraints:
                    nullable: false
              - column:
                  name: running_balance
                  type: DECIMAL(19, 2)
                  constraints:
                    nullable: false
        - createIndex:
            indexName: idx_balance_account_latest
            tableName: balance
            columns:
              - column:
                  name: account_holder_id
              - column:
                  name: id
                  descending: true