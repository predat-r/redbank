databaseChangeLog:
  - changeSet:
      id: 008-seed-roles
      author: haris
      changes:
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ADMIN

        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: ACCOUNT_HOLDER
        - insert:
            tableName: roles
            columns:
              - column:
                  name: name
                  value: PENDING_USER

      rollback:
        - delete:
            tableName: roles
            where: name = 'PENDING_USER'

        - delete:
            tableName: roles
            where: name = 'ACCOUNT_HOLDER'

        - delete:
            tableName: roles
            where: name = 'ADMIN'