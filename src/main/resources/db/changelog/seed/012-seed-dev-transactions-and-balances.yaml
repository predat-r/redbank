databaseChangeLog:
  - changeSet:
      id: 012-seed-dev-transactions-and-balances
      author: codex
      context: dev
      changes:
        - sql:
            sql: |
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-DEPOSIT', NULL, id, 'DEPOSIT', 'Initial account funding', 1000.00, 'COMPLETED', TIMESTAMPTZ '2026-01-01 09:00:00+00', TIMESTAMPTZ '2026-01-01 09:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-DEPOSIT', NULL, id, 'DEPOSIT', 'Initial account funding', 600.00, 'COMPLETED', TIMESTAMPTZ '2026-01-01 09:01:00+00', TIMESTAMPTZ '2026-01-01 09:01:00+00'
              FROM account_holders WHERE account_number = 'RB1000000002';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-TO-JANE', s.id, d.id, 'TRANSFER', 'Payment to Jane Smith', 300.00, 'COMPLETED', TIMESTAMPTZ '2026-01-02 10:00:00+00', TIMESTAMPTZ '2026-01-02 10:00:00+00'
              FROM account_holders s, account_holders d WHERE s.account_number = 'RB1000000001' AND d.account_number = 'RB1000000002';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-TO-JOHN', s.id, d.id, 'TRANSFER', 'Payment from Jane Smith', 200.00, 'COMPLETED', TIMESTAMPTZ '2026-01-03 11:00:00+00', TIMESTAMPTZ '2026-01-03 11:00:00+00'
              FROM account_holders s, account_holders d WHERE s.account_number = 'RB1000000002' AND d.account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-WITHDRAWAL', id, NULL, 'WITHDRAWAL', 'ATM cash withdrawal', 250.00, 'COMPLETED', TIMESTAMPTZ '2026-01-04 12:00:00+00', TIMESTAMPTZ '2026-01-04 12:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-WITHDRAWAL', id, NULL, 'WITHDRAWAL', 'ATM cash withdrawal', 300.00, 'COMPLETED', TIMESTAMPTZ '2026-01-05 13:00:00+00', TIMESTAMPTZ '2026-01-05 13:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000002';

              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT a.id, t.id, t.created_at, t.amount, x.indicator, x.running_balance
              FROM (VALUES
                ('RB1000000001', 'SEED-JOHN-DEPOSIT', 'CREDIT', 1000.00),
                ('RB1000000002', 'SEED-JANE-DEPOSIT', 'CREDIT', 600.00),
                ('RB1000000001', 'SEED-JOHN-TO-JANE', 'DEBIT', 700.00),
                ('RB1000000002', 'SEED-JOHN-TO-JANE', 'CREDIT', 900.00),
                ('RB1000000002', 'SEED-JANE-TO-JOHN', 'DEBIT', 700.00),
                ('RB1000000001', 'SEED-JANE-TO-JOHN', 'CREDIT', 900.00),
                ('RB1000000001', 'SEED-JOHN-WITHDRAWAL', 'DEBIT', 650.00),
                ('RB1000000002', 'SEED-JANE-WITHDRAWAL', 'DEBIT', 400.00)
              ) AS x(account_number, transaction_reference, indicator, running_balance)
              JOIN account_holders a ON a.account_number = x.account_number
              JOIN bank_transactions t ON t.transaction_reference = x.transaction_reference;
      rollback:
        - sql:
            sql: |
              DELETE FROM balance WHERE transaction_id IN (SELECT id FROM bank_transactions WHERE transaction_reference LIKE 'SEED-%');
              DELETE FROM bank_transactions WHERE transaction_reference LIKE 'SEED-%';
