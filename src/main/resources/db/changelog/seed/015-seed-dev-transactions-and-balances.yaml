databaseChangeLog:
  - changeSet:
      id: 012-seed-dev-transactions-and-balances
      author: haris
      context: dev
      changes:
        - sql:
            sql: |
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-DEPOSIT', NULL, id, 'DEPOSIT', 'Initial savings deposit', 'INVESTMENT', 1000.00, 'COMPLETED', TIMESTAMPTZ '2026-01-01 09:00:00+00', TIMESTAMPTZ '2026-01-01 09:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-DEPOSIT', NULL, id, 'DEPOSIT', 'Initial savings deposit', 'INVESTMENT', 600.00, 'COMPLETED', TIMESTAMPTZ '2026-01-01 09:01:00+00', TIMESTAMPTZ '2026-01-01 09:01:00+00'
              FROM account_holders WHERE account_number = 'RB1000000002';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-TO-JANE', s.id, d.id, 'TRANSFER', 'Monthly rent contribution', 'BILLS', 300.00, 'COMPLETED', TIMESTAMPTZ '2026-01-02 10:00:00+00', TIMESTAMPTZ '2026-01-02 10:00:00+00'
              FROM account_holders s, account_holders d WHERE s.account_number = 'RB1000000001' AND d.account_number = 'RB1000000002';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-TO-JOHN', s.id, d.id, 'TRANSFER', 'Shared grocery reimbursement', 'GROCERY', 200.00, 'COMPLETED', TIMESTAMPTZ '2026-01-03 11:00:00+00', TIMESTAMPTZ '2026-01-03 11:00:00+00'
              FROM account_holders s, account_holders d WHERE s.account_number = 'RB1000000002' AND d.account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JOHN-WITHDRAWAL', id, NULL, 'WITHDRAWAL', 'Weekly grocery shopping', 'GROCERY', 250.00, 'COMPLETED', TIMESTAMPTZ '2026-01-04 12:00:00+00', TIMESTAMPTZ '2026-01-04 12:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO bank_transactions
                (transaction_reference, source_account_holder_id, destination_account_holder_id, type, description, category, amount, status, created_at, completed_at)
              SELECT 'SEED-JANE-WITHDRAWAL', id, NULL, 'WITHDRAWAL', 'Public transport expenses', 'TRANSPORT', 300.00, 'COMPLETED', TIMESTAMPTZ '2026-01-05 13:00:00+00', TIMESTAMPTZ '2026-01-05 13:00:00+00'
              FROM account_holders WHERE account_number = 'RB1000000002';

              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JOHN-DEPOSIT'),
                     TIMESTAMPTZ '2026-01-01 09:00:00+00', 1000.00, 'CREDIT', 1000.00
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JANE-DEPOSIT'),
                     TIMESTAMPTZ '2026-01-01 09:01:00+00', 600.00, 'CREDIT', 600.00
              FROM account_holders WHERE account_number = 'RB1000000002';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JOHN-TO-JANE'),
                     TIMESTAMPTZ '2026-01-02 10:00:00+00', 300.00, 'DEBIT', 700.00
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JOHN-TO-JANE'),
                     TIMESTAMPTZ '2026-01-02 10:00:00+00', 300.00, 'CREDIT', 900.00
              FROM account_holders WHERE account_number = 'RB1000000002';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JANE-TO-JOHN'),
                     TIMESTAMPTZ '2026-01-03 11:00:00+00', 200.00, 'DEBIT', 700.00
              FROM account_holders WHERE account_number = 'RB1000000002';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JANE-TO-JOHN'),
                     TIMESTAMPTZ '2026-01-03 11:00:00+00', 200.00, 'CREDIT', 900.00
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JOHN-WITHDRAWAL'),
                     TIMESTAMPTZ '2026-01-04 12:00:00+00', 250.00, 'DEBIT', 650.00
              FROM account_holders WHERE account_number = 'RB1000000001';
              INSERT INTO balance (account_holder_id, transaction_id, entry_date, amount, indicator, running_balance)
              SELECT id, (SELECT id FROM bank_transactions WHERE transaction_reference = 'SEED-JANE-WITHDRAWAL'),
                     TIMESTAMPTZ '2026-01-05 13:00:00+00', 300.00, 'DEBIT', 400.00
              FROM account_holders WHERE account_number = 'RB1000000002';
      rollback:
        - sql:
            sql: |
              DELETE FROM balance WHERE transaction_id IN (SELECT id FROM bank_transactions WHERE transaction_reference LIKE 'SEED-%');
              DELETE FROM bank_transactions WHERE transaction_reference LIKE 'SEED-%';
