databaseChangeLog:
  - changeSet:
      id: 002-create-roles
      author: haris
      changes:
        - createTable:
            tableName: roles
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_roles
                    nullable: false

              - column:
                  name: name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_roles_name

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - sql:
            sql: |
              ALTER TABLE roles
              ADD CONSTRAINT chk_roles_name
              CHECK (
                  name IN (
                      'ADMIN',
                      'ACCOUNT_HOLDER',
                      'PENDING_USER'
                  )
              );

      rollback:
        - dropTable:
            tableName: roles