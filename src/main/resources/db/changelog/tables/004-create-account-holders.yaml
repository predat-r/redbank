databaseChangeLog:
  - changeSet:
      id: 004-create-account-holders
      author: haris

      changes:
        - createTable:
            tableName: account_holders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_account_holders
                    nullable: false

              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_holders_user_id

              - column:
                  name: account_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_account_holders_account_number

              - column:
                  name: currency
                  type: VARCHAR(3)
                  defaultValue: USD
                  constraints:
                    nullable: false

              - column:
                  name: account_status
                  type: VARCHAR(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false

              - column:
                  name: approved_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: account_holders
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_account_holders_user
            onDelete: RESTRICT

        - sql:
            sql: |
              ALTER TABLE account_holders
              ADD CONSTRAINT chk_account_holders_status
              CHECK (
                  account_status IN (
                      'ACTIVE',
                      'FROZEN',
                      'CLOSED'
                  )
              );

        - sql:
            sql: |
              ALTER TABLE account_holders
              ADD CONSTRAINT chk_account_holders_currency
              CHECK (currency = 'USD');

      rollback:
        - dropTable:
            tableName: account_holders