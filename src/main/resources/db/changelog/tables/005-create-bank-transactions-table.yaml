databaseChangeLog:

  - changeSet:
      id: 005-create-bank-transactions-table
      author: Zohaib
      changes:

        - createTable:
            tableName: bank_transactions
            columns:

              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_reference
                  type: VARCHAR(64)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_bank_transactions_reference

              - column:
                  name: source_account_holder_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: destination_account_holder_id
                  type: BIGINT
                  constraints:
                    nullable: true

              - column:
                  name: type
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: description
                  type: VARCHAR(500)
                  constraints:
                    nullable: true

              - column:
                  name: amount
                  type: NUMERIC(19, 4)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

              - column:
                  name: completed_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: true

        - addForeignKeyConstraint:
            constraintName: fk_bank_txn_source_account_holder
            baseTableName: bank_transactions
            baseColumnNames: source_account_holder_id
            referencedTableName: account_holders
            referencedColumnNames: id
            onDelete: RESTRICT

        - addForeignKeyConstraint:
            constraintName: fk_bank_txn_destination_account_holder
            baseTableName: bank_transactions
            baseColumnNames: destination_account_holder_id
            referencedTableName: account_holders
            referencedColumnNames: id
            onDelete: RESTRICT

        - sql:
            sql: >
              ALTER TABLE bank_transactions
                ADD CONSTRAINT chk_bank_transactions_amount_positive
                  CHECK (amount > 0);

        - sql:
            sql: >
              ALTER TABLE bank_transactions
                ADD CONSTRAINT chk_bank_transactions_type
                  CHECK (type IN ('DEPOSIT', 'WITHDRAWAL', 'TRANSFER'));

        - sql:
            sql: >
              ALTER TABLE bank_transactions
                ADD CONSTRAINT chk_bank_transactions_status
                  CHECK (status IN ('PENDING', 'COMPLETED', 'CANCELLED'));
