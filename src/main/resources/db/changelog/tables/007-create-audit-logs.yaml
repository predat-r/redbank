databaseChangeLog:
  - changeSet:
      id: 007-create-audit-logs
      author: haris

      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_audit_logs
                    nullable: false

              - column:
                  name: actor_user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: action
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: target_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: target_identifier
                  type: VARCHAR(100)
                  constraints:
                    nullable: false

              - column:
                  name: details
                  type: VARCHAR(1000)

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            baseTableName: audit_logs
            baseColumnNames: actor_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_audit_logs_actor
            onDelete: RESTRICT

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_actor_user_id
            columns:
              - column:
                  name: actor_user_id

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_created_at
            columns:
              - column:
                  name: created_at

        - createIndex:
            tableName: audit_logs
            indexName: idx_audit_logs_target
            columns:
              - column:
                  name: target_type
              - column:
                  name: target_identifier

      rollback:
        - dropTable:
            tableName: audit_logs