databaseChangeLog:
  - changeSet:
      id: 012-create-anomaly-reports-table
      author: Zohaib
      changes:
        - createTable:
            tableName: anomaly_reports
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: transaction_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_anomaly_reports_transaction_id

              - column:
                  name: risk_score
                  type: INT
                  constraints:
                    nullable: false

              - column:
                  name: recommendation
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: reasoning
                  type: VARCHAR(2000)
                  constraints:
                    nullable: true

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false

        - addForeignKeyConstraint:
            constraintName: fk_anomaly_reports_transaction
            baseTableName: anomaly_reports
            baseColumnNames: transaction_id
            referencedTableName: bank_transactions
            referencedColumnNames: id
            onDelete: CASCADE
